name: SRMS GitHub Actions CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Packages
        run: dotnet restore StudentResultApp/StudentResultApp.csproj

      - name: Build Application
        run: dotnet build StudentResultApp/StudentResultApp.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test StudentResultApp.Tests/StudentResultApp.Tests.csproj --configuration Release --filter "FullyQualifiedName!~StudentResultUiTests"

      - name: Publish Application
        run: dotnet publish StudentResultApp/StudentResultApp.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-result-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      # Posts the final build/deploy result to Slack, whether it succeeded
      # or failed. "if: always()" makes this run even if an earlier step
      # in this job failed.
      - name: Notify Slack of build result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI=":white_check_mark:"
            TEXT="Build & deploy succeeded"
          else
            EMOJI=":x:"
            TEXT="Build & deploy failed"
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$EMOJI *$TEXT* on \`${{ github.ref_name }}\` (${{ github.actor }})\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"