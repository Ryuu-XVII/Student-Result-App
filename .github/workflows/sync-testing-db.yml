name: Sync Testing Database from Production

# Copies production data into the testing database on a schedule, and
# whenever someone triggers it manually from the Actions tab. This is
# one-way: production is never changed by this workflow.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run Sync Tool
        working-directory: Tools/DbSync
        run: dotnet run
        env:
          DB_SYNC_PASSWORD: ${{ secrets.DB_SYNC_PASSWORD }}
